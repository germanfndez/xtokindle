[package]
name = "x2k"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
epub-builder = { version = "0.8.3", default-features = false, features = ["zip-library"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "rustls", "aws-lc-rs", "webpki-roots", "builder", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
